# xdg-desktop-portal-hyprland config. Read once when xdph starts:
#   systemctl --user restart xdg-desktop-portal-hyprland
# after editing. Live-symlinked from dotfiles/hypr/xdph.conf by home_modules/hyprland.nix.

screencopy {
    # Pre-tick "Allow a token for restoring" in the share picker. Apps that ask
    # for a persistent session (RustDesk's --server, OBS, browsers) then get a
    # restore token from xdg-desktop-portal and are not prompted again for the
    # same output/window -- the picker only appears the first time, or when the
    # remembered output no longer exists. The token is a plain description of
    # the selection (output name, cursor mode), so it survives reboots.
    allow_token_by_default = true
}
